name: Обновление списков прокси

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      max_check:
        description: Сколько прокси проверять за прогон
        default: '30000'

permissions:
  contents: write

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Установка зависимостей
        run: pip install --quiet -r requirements.txt

      # Кэш живёт между прогонами, поэтому неудачные прокси не проверяются
      # повторно в течение TTL, но и не засоряют историю коммитов.
      - name: Кэш проверенных прокси
        uses: actions/cache@v4
        with:
          path: data/seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: База GeoIP
        run: |
          mkdir -p data
          curl -fsSL -o data/GeoLite2-Country.mmdb \
            https://raw.githubusercontent.com/Dreamacro/maxmind-geoip/release/Country.mmdb

      - name: Сбор и проверка
        timeout-minutes: 22
        run: |
          # На раннере Linux лимиты сокетов выше, чем на домашней машине,
          # поэтому потоков больше, чем в дефолтах CLI.
          python -m collector \
            --geoip data/GeoLite2-Country.mmdb \
            --output-dir lists \
            --max-check "${{ github.event.inputs.max_check || 30000 }}" \
            --workers 400 \
            --probe-workers 200 \
            --seen-file data/seen.json \
            --quiet

      - name: Итоги в сводку
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          stats = json.loads(pathlib.Path("lists/stats.json").read_text(encoding="utf-8"))
          region = stats["by_region"]
          print("## Итоги прогона\n")
          print("| Показатель | Значение |")
          print("|---|---|")
          print(f"| Проверено | {stats['checked']} |")
          print(f"| Ответили по TCP | {stats['tcp_alive']} |")
          print(f"| **Подтверждено рабочих** | **{stats['total']}** |")
          print(f"| MTProto | {stats['mtproto']} |")
          print(f"| из них probe-resistant | {stats['probe_resistant']} |")
          print(f"| SOCKS5 | {stats['socks5']} |")
          print(f"| RU / EU / US / ASIA | {region['ru']} / {region['eu']} / {region['us']} / {region['asia']} |")
          print(f"| Медианный пинг | {stats['median_ping']} с |")
          print(f"| Время прогона | {stats['seconds']} с |")
          print(f"\nМетоды подтверждения: `{stats['by_method']}`")
          PY

      - name: Коммит списков
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists/
          if git diff --staged --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          COUNT=$(python -c "import json;print(json.load(open('lists/stats.json'))['total'])")
          git commit -m "Обновление списков: $COUNT рабочих прокси"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
